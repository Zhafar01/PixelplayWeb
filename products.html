<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products - PixelPlay</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="logo">Pixel<span>play</span></div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="products.html" class="active">Products</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <section class="page-section">
    <h2>Stock <span class="gradient-text">Produk</span></h2>

    <!-- 
      GANTI nilai berikut sesuai produk Anda:
      - src="images/xxx.jpg"  -> path gambar produk
      - <h3>Nama Produk</h3>  -> nama produk
      - data-product="..."    -> nama yang dikirim ke WhatsApp
      - Nomor WA diatur di script.js (variabel WHATSAPP_NUMBER)
    -->
    <div class="product-grid">
      <div class="product-card">
        <img src="images/product1.jpg" alt="Product 1" />
        <h3>Product Name 1</h3>
        <p class="price">Rp 100.000</p>
        <button class="btn-buy" data-product="Product Name 1">Buy Now</button>
      </div>

      <div class="product-card">
        <img src="images/product2.jpg" alt="Product 2" />
        <h3>Product Name 2</h3>
        <p class="price">Rp 150.000</p>
        <button class="btn-buy" data-product="Product Name 2">Buy Now</button>
      </div>

      <div class="product-card">
        <img src="images/product3.jpg" alt="Product 3" />
        <h3>Product Name 3</h3>
        <p class="price">Rp 200.000</p>
        <button class="btn-buy" data-product="Product Name 3">Buy Now</button>
      </div>

      <div class="product-card">
        <img src="images/product4.jpg" alt="Product 4" />
        <h3>Product Name 4</h3>
        <p class="price">Rp 250.000</p>
        <button class="btn-buy" data-product="Product Name 4">Buy Now</button>
      </div>
    </div>
  </section>

  <footer><p>&copy; 2026 PixelPlay. All rights reserved.</p></footer>
  <script src="script.js"></script>
</body>
</html>
